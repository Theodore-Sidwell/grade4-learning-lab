function renderWriting(){let a=getAttempt(),b=a.bonus||(a.bonus={}),text=b.answer||'',g=gradeBonus(text,dayIndex);let canShow=b.finished;
 app.innerHTML=`${dateHeader()}<section class="card"><div class="row"><div><div class="eyebrow">Optional 5-mark writing practice</div><h3 style="margin:5px 0">Day ${dayIndex+1}: My extra story</h3></div><select id="writingDay" aria-label="Choose day">${DAYS.map((d,i)=>`<option value="${i}" ${i===dayIndex?'selected':''}>Day ${i+1}</option>`).join('')}</select></div><p>${escapeHTML(bonusPrompt(dayIndex))}</p><div class="alert">The story is assessed separately from the 19-mark daily test. The automatic writing score is a rough prompt, not a dependable judgement of creativity or meaning. A parent can change it.</div><label for="bonusAnswer" class="small-text"><strong>Type your story here (or use speech-to-text if available)</strong></label><textarea id="bonusAnswer" class="task-editor" placeholder="One day, ...">${escapeHTML(text)}</textarea><div class="row" style="margin:9px 0"><span class="small-text" id="writingCount">${g.wordCount} words</span><span class="small-text" id="writingSaved">Saved locally</span></div><div class="mic-box"><h4>🎤 Speech-to-text option</h4><p>Your words appear as text. The website does not keep an audio recording.</p><div class="tool-row"><button id="bonusSpeak" class="btn primary small" ${speechAvailable?'':'disabled'}>Start speaking</button><button id="bonusStop" class="btn small" disabled>Stop</button><span class="small-text" id="bonusMicStatus">${speechAvailable?'Ready':'Not supported here: type instead.'}</span></div></div><div class="tool-row" style="margin-top:17px"><button id="bonusFinish" class="btn primary">Check my story and explain ✓</button><button id="bonusDaily" class="btn">Daily summary</button><button id="bonusParent" class="btn">Parent dashboard</button></div></section>${canShow?bonusAnalysisHTML(b,dayIndex):'<div class="card" style="margin-top:15px"><p class="small-text">Finish your story to see the sentence-flow feedback and writing checklist.</p></div>'}`;
 document.getElementById('writingDay').onchange=e=>{cancelDictation();dayIndex=+e.target.value;renderWriting()};document.getElementById('bonusAnswer').oninput=e=>{a.bonus.answer=e.target.value;a.bonus.finished=false;save();document.getElementById('writingCount').textContent=words(e.target.value).length+' words';document.getElementById('writingSaved').textContent='Saved ✓';};
 document.getElementById('bonusFinish').onclick=()=>{a.bonus.answer=document.getElementById('bonusAnswer').value;a.bonus.finished=true;save();renderWriting()};document.getElementById('bonusDaily').onclick=()=>setView('daily');document.getElementById('bonusParent').onclick=()=>setView('report');
 document.getElementById('bonusSpeak').onclick=startBonusDictation;document.getElementById('bonusStop').onclick=stopDictation;
 if(canShow){let mark=document.getElementById('bonusReview');if(mark)mark.onchange=e=>{a.bonus.review=e.target.value===''?undefined:+e.target.value;save();renderWriting()}}
}
function bonusAnalysisHTML(b,di){let g=gradeBonus(b.answer||'',di),score=b.review===undefined?g.draft:b.review,states=g.flow.states;
 return `<section class="card" style="margin-top:16px"><div class="row"><div><div class="eyebrow">Automatic provisional writing feedback</div><h3>${score}/5 · ${g.wordCount} words</h3></div><span class="report-chip">Markov-style story-flow check</span></div><p><strong>What you wrote:</strong> You used ${g.flow.sentences} sentence-like sections. The app estimates each section’s role in the story.</p><div class="state-list">${states.map((s,i)=>`<span class="state">${i+1}. ${escapeHTML(s)}</span>`).join('<span aria-hidden="true">→</span>')||'No sentences yet'}</div><p class="small-text">Flow consistency: ${Math.round(g.flow.geometric*100)}% transition likelihood under a small hand-designed state model. This is NOT a probability your story is correct, and does not prove good writing.</p><ul class="review-checklist">${g.marks.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul><div class="strategy"><strong>A better way to organise your story:</strong> Begin with a place and character → explain the problem → tell what happened → finish with the result → say what was learned. Reread it once to check that every sentence follows logically.</div><p class="small-text">A first-order Markov chain checks only how one estimated story stage follows the previous one. It cannot judge factual accuracy, imagination, meaningful nuance or all appropriate alternative structures.</p><div class="score-pick"><label for="bonusReview">Parent-approved story mark:</label><select id="bonusReview"><option value="" ${b.review===undefined?'selected':''}>Use automatic estimate (${g.draft}/5)</option>${Array.from({length:6},(_,i)=>`<option value="${i}" ${b.review===i?'selected':''}>${i}/5</option>`).join('')}</select></div></section>`}
function startBonusDictation(){const Constructor=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Constructor)return;
 if(recognizer)return;
 let consent=readStore(VERSION+'-speechConsent',false);if(!consent){if(!confirm('Speech recognition may send audio to your browser provider for conversion. Only resulting text is saved. Do you agree?'))return;saveStore(VERSION+'-speechConsent',true)}
 let textarea=document.getElementById('bonusAnswer'),status=document.getElementById('bonusMicStatus'),start=document.getElementById('bonusSpeak'),stop=document.getElementById('bonusStop');if(!textarea)return;
 let ctx={day:dayIndex,base:textarea.value.trim()};try{let r=new Constructor();r.lang='en-ZA';r.continuous=true;r.interimResults=true;recognizer=r;dictationContext=ctx;start.disabled=true;stop.disabled=false;status.textContent='Listening…';
 r.onresult=e=>{if(recognizer!==r||ctx.day!==dayIndex)return;let part=[];for(let j=0;j<e.results.length;j++)part.push((e.results[j][0]?.transcript||'').trim());let val=[ctx.base,...part].filter(Boolean).join(' ');textarea.value=val;getAttempt().bonus.answer=val;getAttempt().bonus.finished=false;save();document.getElementById('writingCount').textContent=words(val).length+' words';status.textContent='Words converted and saved ✓'};
 r.onerror=e=>{status.textContent='Speech recognition issue: '+e.error+'. You can type.'};r.onend=()=>{if(recognizer===r){recognizer=null;dictationContext=null;start.disabled=false;stop.disabled=true;status.textContent='Stopped. Check the typed words.'}};r.start();}
 catch(e){cancelDictation();status.textContent='Microphone did not start. Type your answer.';start.disabled=false;stop.disabled=true;}}
function reviewCard(q,j,entry){let e=entry.grade,score=entry.score,override=entry.override,model=q.type==='choice'?q.options[q.correct]:q.model;return `<article class="review-line"><div class="row"><h4>${j+1}. ${escapeHTML(skillNotes[j])}</h4><span class="report-chip ${score===q.max?'good':'needs'}">${score}/${q.max}</span></div><p class="small-text"><strong>Question:</strong> ${escapeHTML(q.p)}</p><p><strong>Jordan:</strong> ${escapeHTML(formatAnswer(q,entry.answer))}</p><div class="model"><strong>Answer guide:</strong> ${escapeHTML(model)}</div><p class="small-text"><strong>Auto-detected:</strong> ${escapeHTML(e.met.join('; ')||'No listed concepts found')}. ${escapeHTML(e.missing.join('; '))}</p><p class="small-text">Automatic mark ${entry.draft}/${q.max} · ${entry.confidence==='high'?'Exact answer-key match':'Approximate rule-based check; approve or override'}</p><div class="score-pick"><label for="rev${j}">Parent mark:</label><select id="rev${j}" data-review="${j}"><option value="" ${override===undefined?'selected':''}>Automatic (${entry.draft})</option>${Array.from({length:q.max+1},(_,k)=>`<option value="${k}" ${override===k?'selected':''}>${k} / ${q.max}</option>`).join('')}</select></div></article>`}
function schoolTable(){return `<table class="mini-table"><thead><tr><th>School assessment</th><th>Mark</th><th>Percent</th></tr></thead><tbody>${[['Term 1 comprehension',11.5,15],['Prepared reading',13,20],['Essay writing',11.5,20],['Term 2 comprehension',7.5,15],['Visual-text comprehension',4,10],['Fable research',6.5,10]].map(a=>`<tr><td>${a[0]}</td><td>${a[1]}/${a[2]}</td><td>${Math.round(a[1]/a[2]*100)}%</td></tr>`).join('')}</tbody></table>`}
function renderReport(){let a=getAttempt(),sc=getScoreObject(dayIndex),completed=DAYS.filter((d,i)=>getAttempt(i).submitted).length,finished=DAYS.map((d,i)=>({a:getAttempt(i),s:getScoreObject(i)})).filter(x=>x.a.submitted),avg=finished.length?Math.round(100*finished.reduce((sum,x)=>sum+x.s.final/19,0)/finished.length):null;
 let skillbars=skillNotes.map((label,j)=>{let records=finished.map(x=>x.s.result[j]),pct=records.length?Math.round(100*records.reduce((s,x)=>s+x.score,0)/(records.length*maxPoints[j])):null;return `<div class="bar-row"><div class="row"><span class="small-text">${escapeHTML(label)}</span><span class="small-text">${pct===null?'—':pct+'%'}</span></div><div class="bar"><div style="width:${pct||0}%"></div></div></div>`}).join('');
 let week=Array.from({length:4},(_,w)=>{let arr=finished.filter(x=>true);let ids=Array.from({length:7},(_,k)=>w*7+k).filter(i=>getAttempt(i).submitted);let mean=ids.length?Math.round(ids.reduce((s,i)=>s+100*getScoreObject(i).final/19,0)/ids.length):null;return `<div class="bar-row"><div class="row"><strong class="small-text">Week ${w+1}</strong><span class="small-text">${mean===null?'No completed days':mean+'% · '+ids.length+' days'}</span></div><div class="bar"><div style="width:${mean||0}%"></div></div></div>`}).join('');
 let days=DAYS.map((d,i)=>{let day=getAttempt(i),s=getScoreObject(i);return `<button class="week-day ${day.submitted?'done':''} ${i===dayNumFromStart()?'today':''}" data-reportday="${i}"><strong>${i+1}</strong>${day.submitted?Math.round(s.final/19*100)+'%':'—'}</button>`}).join('');let bonus=a.bonus||{};
 app.innerHTML=`${dateHeader()}<div class="report-grid"><section class="card"><div class="section-head">Programme overview</div><div class="results"><div class="metric"><strong>${completed}/28</strong><span>Submitted days</span></div><div class="metric"><strong>${avg===null?'—':avg+'%'}</strong><span>Average indicative test result</span></div><div class="metric"><strong>${hintsUsed(a)}</strong><span>Clues today</span></div></div><p class="small-text">School baseline: reported 50%, class average 64%. School marks are separate from practice marks.</p>${schoolTable()}<div class="section-head" style="margin-top:21px">Select a daily report</div><div class="week-grid">${days}</div><h3>Skills tracked</h3>${skillbars}<h3>Weekly progress</h3>${week}<h3>Saved data</h3><div class="parent-controls"><button class="btn small" id="csvBtn">Export CSV</button><button class="btn small" id="jsonBtn">Backup all answers (JSON)</button><label class="btn small" for="importJson">Restore previous backup</label><input type="file" id="importJson" accept=".json,application/json" class="hidden"></div><div class="row"><label for="startDate" class="small-text">Day 1 starting date</label><input type="date" id="startDate" value="${escapeHTML(startDate)}"></div><button id="saveStart" class="btn small" style="margin-top:8px">Save start date</button><p class="small-text">Saving is local to this browser. Export JSON regularly and restore if changing computer or website address.</p></section><section class="card"><div class="row"><div><div class="eyebrow">Parent answer guide</div><h3 style="margin:5px 0">Day ${dayIndex+1}: ${escapeHTML(DAYS[dayIndex].title)}</h3></div><span class="pill">${a.submitted?'Submitted':'Not finished'}</span></div><div class="results"><div class="metric"><strong>${sc.final}/19</strong><span>Indicative mark</span></div><div class="metric"><strong>${sc.manual}/10</strong><span>Manually checked</span></div><div class="metric"><strong>${hintsUsed(a)}</strong><span>Clues used</span></div></div><div class="assess-notice">Multiple-choice answers are exact; written and speech-to-text marks are estimated and should be checked. The reading task measures only recognised-text overlap, not oral reading quality.</div><div class="tool-row"><button class="btn primary" id="goDaily">View with Jordan</button><button class="btn" id="goTest">Return to test</button><button class="btn" id="goBonus">Extra writing</button><button class="btn" id="printReport">Print / PDF</button></div>${sc.result.map((entry,j)=>reviewCard(entry.q,j,entry)).join('')}<h3>Optional writing</h3>${bonus.answer?`<p><strong>Automatic story mark:</strong> ${gradeBonus(bonus.answer,dayIndex).draft}/5; ${bonus.review!==undefined?'parent mark: '+bonus.review+'/5':''}</p><p>${escapeHTML(bonus.answer)}</p>`:'<p>No optional story yet.</p>'}<label class="small-text" for="parentNotes">Parent observations and suggestions</label><textarea class="parent-note" id="parentNotes" placeholder="What was easy? Which clue helped? What should we practise next?">${escapeHTML(a.parentNotes||'')}</textarea><div class="parent-controls"><button id="parentAccept" class="btn small">Approve all automatic draft scores</button><button id="parentClear" class="btn small ghost">Clear approvals for this day</button></div></section></div>`;
 document.querySelectorAll('[data-reportday]').forEach(b=>b.onclick=()=>{dayIndex=+b.dataset.reportday;renderReport()});document.querySelectorAll('[data-review]').forEach(x=>x.onchange=e=>{let j=+e.target.dataset.review;if(e.target.value==='')delete getAttempt().review['q'+j];else getAttempt().review['q'+j]=+e.target.value;save();renderReport()});
 document.getElementById('parentNotes').oninput=e=>{a.parentNotes=e.target.value;save()};document.getElementById('goDaily').onclick=()=>setView('daily');document.getElementById('goTest').onclick=()=>setView('test');document.getElementById('goBonus').onclick=()=>setView('writing');document.getElementById('printReport').onclick=()=>window.print();
 document.getElementById('csvBtn').onclick=exportCSV;document.getElementById('jsonBtn').onclick=exportJSON;document.getElementById('importJson').onchange=importJSON;
 document.getElementById('saveStart').onclick=()=>{startDate=document.getElementById('startDate').value;saveStore(START_KEY,startDate);renderReport()};
 document.getElementById('parentAccept').onclick=()=>{sc.result.forEach((x,j)=>{a.review['q'+j]=x.draft});save();renderReport()};document.getElementById('parentClear').onclick=()=>{a.review={};save();renderReport()};
}
function renderHelp(){app.innerHTML=`${dateHeader()}<div class="report-grid"><section class="card"><h3>How Jordan uses it</h3><ol class="help-list"><li>Choose the day and read the original Grade 4 story.</li><li>Complete ten questions and open clues when needed. Each clue is tracked separately from marks.</li><li>Speak into the microphone or type. Jordan must check speech-to-text carefully for misheard words.</li><li>Finish the test and open <strong>Daily review</strong>. The explanation shows what his answer noticed, what was missing, a model answer and a way to think.</li><li>Try the <strong>Long writing</strong> challenge if he wants extra practice. The 5-mark optional challenge does not change the daily 19-point score.</li></ol><h3>Automatic marking</h3><p>Choice answers use exact answer keys. Open writing checks for evidence words, synonyms, missing concepts, basic punctuation and specified sentence counts. These are approximate and may miss valid answers or accept incorrect ones.</p><p>Parent marks always override automatic estimates. The scoring program runs locally in the browser; it does not call an artificial-intelligence grading service.</p></section><section class="card"><h3>The sentence-flow chain</h3><p>The optional writing activity uses a simple first-order <strong>Markov-style state transition model</strong>. It labels successive sentences as <em>background → problem → action → outcome → reflection</em> when these labels can be inferred from cue words.</p><p>This estimates whether a story has a plausible sequence. It does not understand every story, guarantee accuracy, recognise originality or provide a validated writing assessment.</p><h3>Privacy and microphone</h3><p>Voice-to-text is provided through the browser and may send speech to the browser provider for recognition. This website saves the converted words, not audio. Some browsers require HTTPS hosting. Keyboard entry always remains available.</p><h3>Saving and transferring</h3><p>Answer records are stored in this browser. If replacing the page at the same URL, existing v1 progress normally remains. To move devices or URLs, export all answers as JSON from the Parent dashboard and restore the file on the new installation.</p><p><strong>Note:</strong> The speech transcription match cannot measure pronunciation, speed, expression or genuine oral reading fluency. A teacher should evaluate those skills in person.</p><button class="btn primary" id="helpStart">Begin the test</button></section></div>`;document.getElementById('helpStart').onclick=()=>setView('test')}
function exportCSV(){let rows=[['Day','Title','Submitted','Date','Indicative score /19','Possible','Parent-reviewed questions','Clues','Writing bonus /5','Parent notes',...skillFor]];
 DAYS.forEach((d,i)=>{let a=getAttempt(i),s=getScoreObject(i),b=a.bonus||{};rows.push([i+1,d.title,a.submitted?'Yes':'No',a.completedAt||'',a.submitted?s.final:'',19,s.manual,hintsUsed(a),b.answer?(b.review===undefined?gradeBonus(b.answer,i).draft:b.review):'',a.parentNotes||'',...s.result.map(x=>x.score)])});downloadBlob(new Blob([rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'Jordan_learning_progress_v2.csv')}
function exportJSON(){let data={app:'Jordan Daily Learning Lab v2',version:2,exported:new Date().toISOString(),startDate,attempts,days:DAYS.map((d,i)=>({day:i+1,title:d.title,attempt:getAttempt(i),scores:getScoreObject(i).result.map(x=>({score:x.score,max:x.q.max}))}))};downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'Jordan_learning_full_backup_v2.json')}
async function importJSON(event){let f=event.target.files?.[0];if(!f)return;try{let json=JSON.parse(await f.text()),incoming=json.attempts||(Array.isArray(json.days)?Object.fromEntries(json.days.map((x,i)=>[String(i),x.attempt])):null);
 if(!incoming||typeof incoming!=='object'||Array.isArray(incoming))throw Error('Invalid progress backup');if(!confirm('Replace saved answers on this browser with this backup?'))return;
 // sanitise origin and indexing; user data is displayed via escapeHTML
 let cleaned={};for(let i=0;i<28;i++){let record=incoming[String(i)];if(record&&typeof record==='object'&&!Array.isArray(record))cleaned[String(i)]={answers:record.answers&&typeof record.answers==='object'?record.answers:{},hints:record.hints&&typeof record.hints==='object'?record.hints:{},review:record.review&&typeof record.review==='object'?record.review:{},submitted:!!record.submitted,completedAt:String(record.completedAt||''),bonus:record.bonus&&typeof record.bonus==='object'?record.bonus:{},parentNotes:String(record.parentNotes||''),assistedReading:!!record.assistedReading};}
 attempts=cleaned;if(/^\d{4}-\d\d-\d\d$/.test(json.startDate||'')){startDate=json.startDate;saveStore(START_KEY,startDate)}save();renderReport();alert('Backup restored.');}catch(e){alert('Could not restore: '+e.message)}finally{event.target.value=''}}
for(let [key,name] of [['navTest','test'],['navDaily','daily'],['navWriting','writing'],['navReport','report'],['navHelp','help']])document.getElementById(key).addEventListener('click',()=>setView(name));
dayIndex=dayNumFromStart();render();
</script>
