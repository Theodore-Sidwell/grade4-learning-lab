<script id="learning-content" type="application/json">[{"title": "The Lantern in the Library", "theme": "Community and kindness", "passage": "On Tuesday afternoon, Mia went to the school library to return a book about oceans. A storm had darkened the sky, and the librarian, Mrs Dube, was closing the windows. Suddenly the lights went out. The younger children became quiet because they could not see their books. Mia remembered the small battery lantern in the emergency cupboard. She asked Mrs Dube for permission before fetching it. Together they placed the lantern on the main desk, where its light reached the reading corner. Mrs Dube then read a short story aloud until the storm passed. Before leaving, Mia checked that the lantern was returned to its shelf. The next morning, the class thanked her for staying calm and helping everyone.", "fact": ["Where did Mia find the lantern?", ["In the playground", "In the emergency cupboard", "In her school bag", "In the kitchen"], 1, "Find the sentence beginning “Mia remembered”."], "detail": ["Name TWO things Mia did to help safely.", [["asked for permission", "permission"], ["returned", "put back", "checked", "shelf"]], "She asked Mrs Dube for permission and returned the lantern afterwards.", "Look for what she did before taking the lantern and before leaving."], "infer": ["Why did the younger children become quiet?", [["lights", "dark", "could not see"], ["worried", "afraid", "scared", "nervous"]], "They could not see their books in the dark and may have felt worried.", "Think about how children might feel when the lights suddenly go out."], "vocab": ["calm", ["very noisy", "not frightened or upset", "extremely hungry", "full of energy"], 1, "Notice how Mia behaves during the storm."], "explain": ["Explain in your own words why the class thanked Mia.", [["help", "lantern", "light"], ["calm", "safe", "thoughtful", "kind"]], "They appreciated that Mia stayed calm and found a safe way to help everyone see.", "The class was grateful for her actions and her attitude."], "grammar": ["yesterday mia help the children", "Yesterday Mia helped the children.", "helped"], "summary": ["In TWO complete sentences, explain the problem and how it was solved.", [["lights", "dark", "storm", "power"], ["lantern", "read", "help"]], "The library lights went out during a storm. Mia helped bring a lantern so the children could continue enjoying a story.", "Sentence one: problem. Sentence two: solution."], "oral": "Tell me about a time you helped someone stay calm."}, {"title": "A Rain Gauge in the Garden", "theme": "Weather and observation", "passage": "Sipho and his grandfather built a rain gauge using a clear plastic bottle. They cut off the top, turned it upside down like a funnel, and marked centimetres on the side. Sipho placed the bottle in an open part of the garden, away from trees and roofs. That night, heavy rain drummed on the windows. The next morning the bottle contained three centimetres of water. Sipho wanted to move it under the veranda to protect it, but his grandfather explained that the roof would stop some rain from entering. They wrote the measurement in a notebook and emptied the bottle. By Friday, Sipho had recorded four different measurements. He noticed that one rainy-looking day had produced almost no rain. He learned that careful measuring is more reliable than guessing from the clouds.", "fact": ["Where did Sipho place the rain gauge?", ["Under a roof", "Near the television", "In an open part of the garden", "Inside the garage"], 2, "Look at the sentence explaining where the bottle was placed."], "detail": ["Name TWO steps used to build the rain gauge.", [["cut", "top"], ["turned", "upside down", "funnel", "marked", "centimetre"]], "They cut off the bottle top and marked centimetres on the side.", "Find the sentence that describes cutting and marking the bottle."], "infer": ["Why was the veranda a poor place for the rain gauge?", [["roof", "cover", "veranda"], ["block", "stop", "less rain", "not accurate"]], "The veranda roof would block some rain and make the measurement inaccurate.", "Think about what the roof would do to falling rain."], "vocab": ["reliable", ["can be trusted", "made of metal", "very expensive", "hard to carry"], 0, "A reliable result is one you can believe."], "explain": ["Why did Sipho record measurements in a notebook?", [["compare", "track", "remember", "record"], ["days", "change", "pattern", "rain"]], "He wanted to compare the rainfall on different days and see any patterns.", "Consider what becomes easier when results are written down."], "grammar": ["sipho measure the rain yesterday", "Sipho measured the rain yesterday.", "measured"], "summary": ["Summarise what Sipho built and what he learned in TWO sentences.", [["bottle", "gauge", "rain"], ["measure", "guess", "cloud", "accurate"]], "Sipho made a rain gauge from a plastic bottle. He discovered that measuring rainfall is better than guessing from clouds.", "First describe the object, then the lesson."], "oral": "Describe how to measure rain fairly, using the garden as an example."}, {"title": "The Late School Bus", "theme": "Transport and planning", "passage": "Every Wednesday, Thandi travelled to chess club on the school bus. One afternoon the bus did not arrive at its usual time. Rather than walking away, Thandi waited with two classmates beside the school office. After ten minutes, the secretary explained that roadworks had delayed the driver. Thandi called her grandmother to explain that she would arrive later than expected. While they waited, the children practised chess moves on a small board. The bus arrived twenty minutes late, but the driver took the normal, safe route instead of racing through back streets. When Thandi reached the club, the coach praised her for keeping someone informed and waiting in a supervised place. Thandi realised that being late was frustrating, but staying safe mattered more than arriving first.", "fact": ["Who explained why the bus was late?", ["The chess coach", "The secretary", "The bus cleaner", "Thandi’s cousin"], 1, "Look for the explanation after ten minutes."], "detail": ["Name TWO sensible things Thandi did while waiting.", [["office", "waited", "supervised"], ["called", "grandmother", "informed"]], "She waited by the school office and called her grandmother.", "Look for the safe place and the person she contacted."], "infer": ["Why did the driver avoid racing through back streets?", [["safe", "danger", "risk", "accident"], ["passengers", "children", "traffic", "speed"]], "He wanted to keep the passengers safe rather than take dangerous shortcuts.", "Think about the risks of speeding in a bus."], "vocab": ["delayed", ["made early", "made late", "made smaller", "made louder"], 1, "Roadworks affected when the bus arrived."], "explain": ["Why did the coach praise Thandi?", [["told", "called", "informed", "grandmother"], ["wait", "safe", "supervised", "office"]], "She kept her grandmother informed and waited in a safe, supervised place.", "The coach praised two decisions, not her chess skill."], "grammar": ["the bus arrive late yesterday", "The bus arrived late yesterday.", "arrived"], "summary": ["Write TWO sentences telling what went wrong and how Thandi responded.", [["bus", "late", "roadwork"], ["wait", "called", "safe"]], "Roadworks made Thandi’s school bus late. She waited safely and informed her grandmother.", "Include one problem and at least one action."], "oral": "Explain why telling an adult about a delay is important."}, {"title": "The Bottle-Cap Challenge", "theme": "Recycling and teamwork", "passage": "Mr Patel asked Grade 4 to collect clean plastic bottle caps for an art project. The class hoped to make a colourful picture of an elephant. On Monday, they counted 140 caps, but many were still sticky. Karabo suggested sorting the caps by colour and washing them before gluing anything. Some children wanted to start immediately because they were excited. Mr Patel agreed with Karabo that careful preparation would help the artwork last longer. By Wednesday, the class had enough clean caps to fill the elephant's body and ears. They used cardboard left over from another project instead of buying a new board. At the exhibition, families admired the elephant. Karabo said that the best part was learning how small pieces, when organised well, could create something impressive.", "fact": ["What animal did the class make?", ["A zebra", "An elephant", "A lion", "A giraffe"], 1, "Look in the second sentence."], "detail": ["Name TWO ways the class prepared the materials.", [["sort", "colour"], ["wash", "clean"]], "They sorted the caps by colour and washed them.", "Look at Karabo’s suggestion."], "infer": ["Why did Mr Patel agree that they should not glue the caps immediately?", [["sticky", "dirty", "wash", "clean"], ["last", "strong", "stick", "prepare"]], "Clean, prepared caps would stick better and help the picture last longer.", "Think about what might happen if glue is placed on sticky caps."], "vocab": ["admired", ["looked at with appreciation", "threw away", "argued about", "forgot completely"], 0, "Consider how the families felt about the finished elephant."], "explain": ["What does the story teach about teamwork?", [["work together", "organise", "prepare", "team"], ["good result", "art", "picture", "success"]], "Working together and organising materials carefully can produce a strong final result.", "Karabo planned, and the class followed the plan."], "grammar": ["karabo wash the caps yesterday", "Karabo washed the caps yesterday.", "washed"], "summary": ["Summarise the class project and its success in TWO sentences.", [["caps", "elephant", "art"], ["wash", "sort", "exhibit", "family"]], "The class used recycled bottle caps to make an elephant picture. They prepared the caps carefully and showed the artwork at an exhibition.", "What did they make, and how did the project end?"], "oral": "Tell a short story about a time your class worked together."}, {"title": "The Missing Museum Map", "theme": "History and problem-solving", "passage": "During a class visit to a history museum, Amina was given a map showing six exhibition rooms. She folded it neatly and placed it in her pocket. After the class visited the room of old sailing ships, Amina could not find her map. She did not rush into another room. Instead, she told her teacher and described the last place she remembered holding it. The teacher asked a guide for a spare map and reminded the class to stay together. When they returned to the ship room, they found Amina's map beneath a wooden bench. Amina felt relieved, but she decided to keep using the spare because it was easier to read. On the way home she told her friend that asking for help was wiser than searching the large museum alone.", "fact": ["Where was Amina’s original map found?", ["Under a bench", "In the bus", "At the ticket counter", "Inside a ship"], 0, "Look at the sentence describing the return to the ship room."], "detail": ["Name TWO things Amina did when she noticed the map was missing.", [["told", "teacher", "asked for help"], ["described", "last place", "remembered", "explained"]], "She told her teacher and explained where she last remembered having the map.", "Look at her response before a spare was provided."], "infer": ["Why was searching the museum alone a poor idea?", [["lost", "separate", "alone"], ["safe", "large", "teacher", "group"]], "She might have become lost or separated from her class in the large museum.", "Consider the risks of leaving a school group."], "vocab": ["relieved", ["glad a worry has ended", "angry at a friend", "tired from running", "confused about a map"], 0, "Think about how Amina felt when the map was found."], "explain": ["Why did Amina decide to use the spare map?", [["easier", "clear", "read"], ["spare", "map", "original"]], "The spare map was easier to read than her original map.", "The passage gives a practical reason, not an emotional one."], "grammar": ["amina tell her teacher yesterday", "Amina told her teacher yesterday.", "told"], "summary": ["Write TWO sentences describing the problem and the solution.", [["lost", "map"], ["teacher", "guide", "spare", "found"]], "Amina lost her map during a museum visit. She asked her teacher for help and received a spare before the old one was found.", "State what was lost and what helped."], "oral": "Explain what you should do if you become separated from your class on an outing."}, {"title": "A Tiny Rescue", "theme": "Fables and consequences", "passage": "A young mouse once saw a lion sleeping under a thorn tree. As the mouse hurried over the lion's paw, the lion woke and caught him. The mouse begged to be released and promised that he might help the lion one day. The lion laughed because the mouse was so small, but he let him go. Several days later, hunters trapped the lion in a strong net. The lion roared until his voice grew hoarse. Hearing the noise, the mouse hurried to the trap and began gnawing the ropes. Slowly, a large hole appeared, and the lion escaped. The lion thanked the mouse and admitted that he had been wrong to think size determined usefulness. The mouse replied that a kind action is never wasted.", "fact": ["What trapped the lion?", ["A deep river", "A strong net", "A locked cage", "A fallen tree"], 1, "Find the sentence about the hunters."], "detail": ["Name TWO things the mouse did to help the lion.", [["came", "hurried", "heard", "trap"], ["gnawed", "chewed", "ropes", "hole"]], "He hurried to the trap and chewed through the ropes.", "Look at the actions after the mouse heard the roar."], "infer": ["Why did the lion first laugh at the mouse’s promise?", [["small", "tiny", "size"], ["not help", "weak", "useful", "power"]], "The lion believed a small mouse could not help an animal as powerful as himself.", "Compare the size of the two animals."], "vocab": ["admitted", ["agreed something was true", "shouted loudly", "ran away", "fell asleep"], 0, "The lion recognised he had been wrong."], "explain": ["Explain the moral of the fable in your own words.", [["small", "size", "anyone", "everybody"], ["help", "kind", "useful", "difference"]], "Even someone small can offer important help, so we should not judge usefulness by size.", "Think about who helped whom, and what surprised the lion."], "grammar": ["the mouse help the lion yesterday", "The mouse helped the lion yesterday.", "helped"], "summary": ["Write TWO sentences telling how the lion and mouse helped each other.", [["lion", "let", "release", "free"], ["mouse", "rope", "net", "rescue"]], "The lion first released the mouse. Later, the mouse chewed through a net to rescue the lion.", "Include the two acts of kindness in the correct order."], "oral": "Explain how a small act of kindness can make a big difference."}, {"title": "The Balloon at the Science Fair", "theme": "Science and evidence", "passage": "At the school science fair, Leah wanted to show that warm air expands. She placed an empty balloon over the mouth of a glass bottle while her teacher prepared two bowls of water. One bowl contained warm water and the other cool water. With the teacher watching, Leah set the bottle in the warm water. The balloon slowly grew bigger even though nobody blew into it. She moved the bottle into the cool water, and the balloon began to shrink. Visitors asked whether it was a magic trick. Leah explained that warming the air in the bottle made it take up more space, while cooling it had the opposite effect. She repeated the experiment twice to check that the result was not a lucky accident.", "fact": ["What happened to the balloon in warm water?", ["It disappeared", "It changed colour", "It grew bigger", "It burst"], 2, "Read the sentence after Leah put the bottle in warm water."], "detail": ["Name TWO things Leah did to make the demonstration reliable or safe.", [["teacher", "watch", "supervision"], ["repeated", "twice", "checked"]], "She worked under her teacher’s supervision and repeated the experiment twice.", "Look for an adult and something Leah did again."], "infer": ["Why did Leah repeat the experiment?", [["check", "confirm", "test"], ["same result", "accident", "reliable", "true"]], "She wanted to confirm that the result happened consistently and was not an accident.", "Scientists do not rely on one result only."], "vocab": ["expands", ["takes up more space", "becomes invisible", "makes a loud sound", "gets colder"], 0, "The warm balloon became bigger."], "explain": ["Why did the balloon shrink when the bottle cooled?", [["air", "cool", "temperature"], ["less space", "shrink", "contract", "smaller"]], "The air cooled and took up less space, so the balloon became smaller.", "Think about the opposite of warm air expanding."], "grammar": ["leah put the bottle in warm water yesterday", "Leah put the bottle in warm water yesterday.", "put"], "summary": ["Summarise the experiment and its result in TWO sentences.", [["bottle", "balloon", "water"], ["warm", "expand", "cool", "shrink"]], "Leah placed a balloon over a bottle and put it in warm and cool water. The balloon expanded in warm water and shrank when cooled.", "Describe the equipment, then the change."], "oral": "Explain this experiment as if you were showing it to a younger child."}, {"title": "The Change at the Market", "theme": "Money and honesty", "passage": "On Saturday, Noah went to the vegetable market with his aunt. They bought tomatoes, carrots and potatoes from a friendly seller. His aunt paid with a fifty-rand note. The seller was busy helping another customer and accidentally gave them ten rand too much change. Noah noticed the extra coin before they left the stall. For a moment he imagined buying a packet of sweets. Then he remembered his aunt's advice: money that belongs to somebody else should be returned. He showed his aunt the mistake and took the extra money back to the seller. The woman thanked him and corrected the change. As they walked home, Noah felt proud. His aunt told him that honesty sometimes means giving up something you would like to keep.", "fact": ["Where did Noah go with his aunt?", ["A library", "A vegetable market", "A cinema", "A stadium"], 1, "The opening sentence tells you the place."], "detail": ["Name TWO things Noah did after noticing the extra money.", [["showed", "told", "aunt"], ["returned", "gave back", "seller"]], "He showed his aunt the mistake and returned the extra money to the seller.", "Look at Noah’s actions, not his thoughts about sweets."], "infer": ["Why did Noah think about buying sweets?", [["extra", "money", "change"], ["spend", "buy", "sweets", "tempted"]], "He was tempted to spend the extra change on something he wanted.", "Think about why the extra coin seemed useful to him."], "vocab": ["accidentally", ["by mistake", "on purpose", "very slowly", "with anger"], 0, "The seller did not intend to give extra change."], "explain": ["What does the story teach about honesty?", [["return", "tell", "truth", "honest"], ["not yours", "money", "temptation", "right thing"]], "Honesty means returning what is not yours even when you would like to keep it.", "Noah did the right thing despite wanting sweets."], "grammar": ["noah return the money yesterday", "Noah returned the money yesterday.", "returned"], "summary": ["Write TWO sentences explaining the mistake and Noah’s decision.", [["seller", "change", "extra", "money"], ["returned", "honest", "gave back"]], "The seller gave Noah and his aunt too much change. Noah returned the extra money because he knew it was the right thing to do.", "Describe what happened and what Noah chose."], "oral": "Explain what you would do if a cashier gave you too much change."}, {"title": "The Missing Football", "theme": "Evidence and fairness", "passage": "When the bell rang for break, the Grade 4 football was missing from its usual cupboard. Ben immediately blamed Lucas because Lucas had borrowed it the day before. Lucas looked upset and said he had returned it. Their teacher asked everyone to stop arguing and search carefully. Ben checked behind the sports bags, while Lucas looked under the benches. At last Priya noticed a round shape beneath a stack of old cones. The ball had rolled there when the cupboard was cleaned. Ben apologised to Lucas for making an accusation without proof. Lucas accepted the apology, but he asked Ben to speak to him first next time. The teacher reminded the class that evidence is more useful than guessing when something goes wrong.", "fact": ["Who found the ball beneath the cones?", ["Lucas", "Ben", "Priya", "The coach"], 2, "Find the sentence beginning “At last”."], "detail": ["Name TWO places the children searched before finding the ball.", [["sports bags", "bags"], ["benches", "bench"]], "They searched behind the sports bags and under the benches.", "Find what Ben checked and where Lucas looked."], "infer": ["Why was Ben wrong to blame Lucas immediately?", [["no proof", "evidence", "did not know"], ["accuse", "unfair", "blame", "guess"]], "Ben had no evidence that Lucas took the ball, so the accusation was unfair.", "Remember that borrowing something yesterday does not prove it is missing today."], "vocab": ["accusation", ["a statement blaming someone", "a game rule", "an invitation", "a type of cupboard"], 0, "Ben blamed Lucas for something he had not proved."], "explain": ["Why did Lucas ask Ben to speak to him first next time?", [["ask", "talk", "check", "listen"], ["before", "blame", "accuse", "assume"]], "Lucas wanted Ben to ask questions before accusing him of doing something wrong.", "The request is about treating other people fairly."], "grammar": ["ben blame lucas yesterday", "Ben blamed Lucas yesterday.", "blamed"], "summary": ["Write TWO sentences explaining the problem and what the class learned.", [["ball", "missing", "cupboard"], ["evidence", "apologised", "not blame", "proof"]], "The football went missing and Ben unfairly blamed Lucas. When the class found it, Ben learned to look for evidence before accusing someone.", "One sentence for the event, one for the lesson."], "oral": "Describe how you can solve a disagreement fairly."}, {"title": "A Cleaner Beach", "theme": "Environment and community", "passage": "Zara visited the beach with her family on a bright Sunday morning. She was disappointed to see bottle tops, paper and food wrappers scattered near the rocks. A volunteer group was handing out gloves and reusable bags. Zara and her older brother joined the group after their father checked that it was safe. They picked up ordinary litter but left sharp objects for the adult volunteers. By midday, their bags were full and the sand looked much cleaner. A volunteer explained that plastic can harm sea birds and other animals if it is swallowed or becomes tangled around them. At home, Zara suggested that her family pack snacks in reusable containers next time. She realised that cleaning up is helpful, but preventing litter is even better.", "fact": ["What did volunteers provide?", ["Buckets and fishing rods", "Gloves and reusable bags", "Sandals and umbrellas", "Paint and brushes"], 1, "Look at what the volunteer group handed out."], "detail": ["Name TWO safety choices Zara’s family made.", [["father", "check", "safe"], ["sharp", "adult", "left"]], "Her father checked it was safe, and the children left sharp objects for adults.", "Look for safety decisions before and during the cleanup."], "infer": ["Why did Zara suggest reusable snack containers?", [["less", "reduce", "prevent"], ["litter", "plastic", "rubbish", "waste"]], "She wanted to reduce rubbish before it reached the beach.", "Think about what happens when you do not throw away wrappers."], "vocab": ["scattered", ["spread around in different places", "stacked in one box", "hidden below water", "washed carefully"], 0, "The litter was in many places near the rocks."], "explain": ["Explain why plastic litter is dangerous for sea animals.", [["swallow", "eat", "tangle", "wrap"], ["harm", "hurt", "injure", "die", "danger"]], "Animals may swallow plastic or become tangled in it, which can hurt them.", "Use the volunteer’s two examples."], "grammar": ["zara pick up litter yesterday", "Zara picked up litter yesterday.", "picked"], "summary": ["Write TWO sentences describing the problem and an action to prevent it.", [["litter", "plastic", "beach"], ["reusable", "container", "prevent", "clean"]], "Zara found a beach covered with litter and helped clean it. She decided that using reusable containers could prevent more waste.", "One sentence on litter, one on prevention."], "oral": "Explain two ways your family could reduce waste."}, {"title": "The Telescope Surprise", "theme": "Space and patience", "passage": "Uncle Peter promised to show Lindi the moon through his telescope. At sunset, Lindi rushed outside, but the sky was still too bright to see many stars. She complained that the telescope was broken. Uncle Peter smiled and explained that they needed to wait until the sky grew darker. They checked the telescope's legs and made sure it stood firmly on level ground. Later that evening, clouds moved away and the moon shone brightly. Lindi looked through the eyepiece and saw dark patches and pale craters. She wanted to touch the glass to point at a crater, but her uncle reminded her that fingerprints would blur the view. Before going inside, Lindi drew what she had observed. She discovered that careful preparation and patience can reveal things that rushing might hide.", "fact": ["What did Lindi see on the moon?", ["Trees and rivers", "Craters and dark patches", "Animals and houses", "Bright green fields"], 1, "Read what she noticed through the eyepiece."], "detail": ["Name TWO things they did to prepare the telescope.", [["legs", "checked", "firm"], ["level", "ground", "stood"]], "They checked the legs and placed the telescope on level ground.", "Find the sentence about making the telescope steady."], "infer": ["Why did they have to wait until later?", [["sky", "dark", "bright", "sunset"], ["see", "stars", "moon", "clear"]], "A darker sky made it easier to see celestial objects clearly.", "Compare the sky at sunset and later in the evening."], "vocab": ["blur", ["make less clear", "make brighter", "make heavier", "make larger"], 0, "Fingerprints would spoil the clear view."], "explain": ["Why did Lindi draw what she saw?", [["record", "remember", "draw", "observe"], ["moon", "crater", "details"]], "She wanted to record and remember the details she observed on the moon.", "Think about why scientists keep notes or drawings."], "grammar": ["lindi look through the telescope yesterday", "Lindi looked through the telescope yesterday.", "looked"], "summary": ["Write TWO sentences explaining what Lindi learned during the evening.", [["wait", "dark", "patience"], ["moon", "crater", "observ", "telescope"]], "Lindi learned to wait until the sky was dark enough. She then used the telescope carefully to observe craters on the moon.", "Describe the waiting and the discovery."], "oral": "Tell someone how to use a telescope carefully."}, {"title": "The Food Festival Stall", "theme": "Planning and budgeting", "passage": "Grade 4 planned a small food stall for the school festival. Their teacher gave them a budget and asked them to choose a snack that would be inexpensive to make. Some learners suggested cupcakes with costly decorations. Others preferred fruit cups because the ingredients were easier to prepare. Nandi wrote down the price of each ingredient and compared the totals. The class chose fruit cups and asked adults to supervise the cutting. They displayed a sign listing the ingredients for anyone with food allergies. On festival day, the fruit cups sold quickly, but the class did not spend all the money they received. They first calculated their costs and then set aside a small amount for next year's event. Nandi said planning had helped them avoid wasting money.", "fact": ["What snack did the class choose?", ["Cupcakes", "Fruit cups", "Sandwiches", "Biscuits"], 1, "Look for the sentence beginning “The class chose”."], "detail": ["Name TWO sensible precautions the class took.", [["adult", "supervise", "cut"], ["allergies", "allergy", "ingredients", "ingredient", "sign", "listed"]], "They asked adults to supervise cutting and listed ingredients for people with allergies.", "Look for adult supervision and the information sign."], "infer": ["Why did Nandi compare ingredient prices?", [["budget", "cost", "money", "afford"], ["choose", "cheap", "less", "save"]], "She wanted the class to choose an affordable snack and stay within its budget.", "Remember the teacher’s instruction about cost."], "vocab": ["budget", ["a plan for spending money", "a kind of recipe", "a small market stall", "a drawing of fruit"], 0, "The class needed to control what it spent."], "explain": ["Why did the class subtract costs before deciding what money remained?", [["cost", "expense", "spent"], ["profit", "remaining", "left", "earned"]], "They needed to know how much money was left after paying for ingredients.", "Money received is not the same as money kept."], "grammar": ["nandi compare prices yesterday", "Nandi compared prices yesterday.", "compared"], "summary": ["In TWO sentences, explain how planning helped the stall.", [["prices", "budget", "fruit", "cost"], ["safe", "sold", "saved", "left"]], "The class compared prices and chose fruit cups that fitted the budget. They prepared safely and saved some money after the festival.", "Include a planning decision and its outcome."], "oral": "Explain how you would plan a small school stall without wasting money."}, {"title": "The River Crossing", "theme": "Engineering and teamwork", "passage": "After heavy rain, a small wooden bridge on the walking trail became unsafe. The park ranger closed the path and put up a clear warning sign. At school, Mr Nkosi showed his class photographs of the damaged bridge and asked how engineers might improve it. Musa suggested using stronger supports, while Ella said the bridge should be raised so floodwater could pass below it. The class built a model using cardboard strips and blocks. Their first model bent when they placed a heavy book on it. Instead of giving up, they added diagonal supports and tested it again. This time it held the book. Mr Nkosi explained that real bridges need professional design and inspections before people can use them. Musa learned that testing a model helps reveal weaknesses before a structure is built.", "fact": ["Who closed the unsafe trail?", ["The park ranger", "Musa", "Ella", "The bus driver"], 0, "The answer appears soon after the bridge becomes unsafe."], "detail": ["Name TWO improvements suggested or made to the bridge design.", [["strong", "support", "diagonal"], ["raised", "higher", "floodwater"]], "They considered stronger supports and raising the bridge above floodwater.", "Find Musa’s idea and Ella’s idea."], "infer": ["Why did the class test its bridge model with a heavy book?", [["test", "check", "strength"], ["weight", "hold", "bend", "safe"]], "They wanted to check whether the structure could hold weight without bending.", "Think about what engineers must know before someone crosses a bridge."], "vocab": ["diagonal", ["slanting across at an angle", "perfectly round", "made of plastic", "always vertical"], 0, "The added supports were neither straight across nor straight up."], "explain": ["Why was the second bridge model stronger?", [["diagonal", "support", "added"], ["hold", "weight", "strength", "bend"]], "The extra diagonal supports helped it carry the book without bending.", "Compare the first and second tests."], "grammar": ["musa build a model yesterday", "Musa built a model yesterday.", "built"], "summary": ["Write TWO sentences describing the bridge problem and the class’s test.", [["bridge", "flood", "unsafe", "rain"], ["model", "support", "book", "test"]], "Rain damaged a bridge and made it unsafe. The class tested a model and strengthened it using diagonal supports.", "One sentence about the real bridge and one about the model."], "oral": "Explain why a bridge should be tested before people use it."}, {"title": "The School Newspaper", "theme": "Media literacy and fact checking", "passage": "The Grade 4 class decided to publish a small newspaper about school events. Kayla wanted to write that the school had won every match in the football tournament. Her friend Daniel checked the score sheet and noticed that one match had ended in a draw. Kayla was disappointed because “won every match” sounded more exciting. Their teacher explained that a newspaper should report accurate information, even when the truth is less dramatic. Kayla corrected her article and added a short interview with the goalkeeper. Daniel checked the spelling of players' names before the newspaper was printed. When families read the newspaper, they congratulated the class on its careful reporting. Kayla learned that being trustworthy is more important than making a story sound impressive.", "fact": ["What had actually happened in one football match?", ["It was cancelled", "It ended in a draw", "It was played at night", "It was lost by ten goals"], 1, "Find the sentence about Daniel checking the score sheet."], "detail": ["Name TWO ways the class checked its newspaper.", [["score", "sheet", "checked", "result"], ["spelling", "names", "players"]], "Daniel checked the score sheet and the spelling of players’ names.", "Look for the two things Daniel verified."], "infer": ["Why did Kayla first want to say the team won every match?", [["exciting", "dramatic", "impressive"], ["readers", "story", "interesting"]], "She wanted the article to sound more exciting to readers.", "Find what Kayla thought about the dramatic version."], "vocab": ["accurate", ["correct and free from mistakes", "very colourful", "easy to fold", "written in pencil"], 0, "A newspaper should tell the truth."], "explain": ["Why is it important for newspaper writers to check their facts?", [["true", "correct", "accurate", "fact"], ["trust", "reader", "mislead", "mistake"]], "Readers need information they can trust, so writers should prevent incorrect claims.", "Consider what happens when a reader believes a false report."], "grammar": ["kayla correct the article yesterday", "Kayla corrected the article yesterday.", "corrected"], "summary": ["Write TWO sentences explaining the newspaper mistake and its correction.", [["won", "draw", "wrong", "match"], ["checked", "corrected", "true", "score"]], "Kayla mistakenly claimed the team won every match. Daniel checked the scores, and she corrected the article.", "What was wrong, and how was it fixed?"], "oral": "Explain how to check whether an exciting story is true."}, {"title": "The Hilltop Walk", "theme": "Preparation and safety", "passage": "On the morning of the hilltop walk, Arjun packed a water bottle, a hat and a small snack. His cousin asked why he needed water when the path was only three kilometres long. Arjun explained that a short distance can still feel difficult on a hot day. The group followed marked signs and stopped at a shaded bench halfway up the hill. From there they could see the farms and a winding river below. One member of the group wanted to take a steep shortcut. Their leader refused because loose stones could make someone slip. At the top, Arjun shared his snack and took photographs. When they returned, his cousin admitted that carrying water and staying on the marked path had been sensible choices.", "fact": ["How long was the walking path?", ["One kilometre", "Three kilometres", "Ten kilometres", "Twenty kilometres"], 1, "The distance is mentioned near the beginning."], "detail": ["Name TWO items Arjun packed.", [["water", "bottle"], ["hat", "snack"]], "Arjun packed a water bottle and a hat.", "Find the list of items at the start."], "infer": ["Why did the leader refuse the shortcut?", [["steep", "loose", "stone", "slip"], ["danger", "injury", "unsafe", "fall"]], "Loose stones on the steep shortcut could cause someone to slip and get hurt.", "Think about the danger of walking on loose stones."], "vocab": ["winding", ["curving and turning", "extremely dry", "made by people", "hidden underground"], 0, "The river did not flow in one straight line."], "explain": ["Why was carrying water sensible even for a short walk?", [["hot", "heat", "sweat", "thirst"], ["drink", "hydration", "water", "tired"]], "They could become thirsty or tired in the heat and needed water to drink.", "Distance is not the only thing that makes a walk difficult."], "grammar": ["arjun pack a water bottle yesterday", "Arjun packed a water bottle yesterday.", "packed"], "summary": ["Write TWO sentences describing the preparation and the safety decision.", [["water", "hat", "snack", "packed"], ["shortcut", "path", "safe", "stone"]], "Arjun packed water, a hat and a snack for the walk. The group stayed on the marked path instead of taking a dangerous shortcut.", "Mention something packed and something avoided."], "oral": "Explain how to prepare for a walk on a hot day."}, {"title": "A New Home for Pepper", "theme": "Animal welfare", "passage": "After several visits to the animal shelter, Ayanda's family decided to adopt Pepper, a shy brown dog. Pepper had spent months in a noisy kennel and was nervous around strangers. At home, Ayanda wanted to hug her immediately, but the shelter worker advised giving Pepper space to explore. The family placed a soft bed in a quiet corner and kept fresh water nearby. For the first two days, Pepper watched everyone from a distance. Ayanda sat nearby and read her book without forcing the dog to play. On the third morning, Pepper walked over and rested her head on Ayanda's knee. Ayanda was delighted. She understood that trust develops through calm, patient behaviour rather than being demanded all at once.", "fact": ["What was the adopted dog called?", ["Dusty", "Pepper", "Rex", "Lulu"], 1, "The dog’s name appears in the opening sentence."], "detail": ["Name TWO things the family provided to help Pepper settle.", [["bed", "quiet", "corner"], ["water", "fresh"]], "They prepared a bed in a quiet corner and placed fresh water nearby.", "Find the sentence describing her new resting place."], "infer": ["Why did Ayanda avoid hugging Pepper immediately?", [["nervous", "shy", "stranger", "scared"], ["space", "trust", "calm", "settle"]], "Pepper was nervous and needed time and space to feel safe.", "Consider how a shy animal reacts to unfamiliar people."], "vocab": ["adopt", ["take an animal into your family", "teach an animal a trick", "wash an animal", "give an animal a name"], 0, "The family took Pepper home to live with them."], "explain": ["What did Ayanda learn about earning trust?", [["patient", "time", "wait", "slow"], ["kind", "gentle", "calm", "safe"]], "Trust grows when we are patient, gentle and allow others time to feel safe.", "Notice what Ayanda did while waiting for Pepper to approach."], "grammar": ["ayanda sit quietly yesterday", "Ayanda sat quietly yesterday.", "sat"], "summary": ["Write TWO sentences about Pepper’s problem and how Ayanda helped.", [["shy", "nervous", "shelter", "new home"], ["patient", "read", "space", "trust"]], "Pepper was shy in her new home. Ayanda gave her space and waited patiently until Pepper began to trust her.", "First Pepper’s feelings, then Ayanda’s response."], "oral": "Explain how to help a nervous pet settle into a new home."}, {"title": "Cooking with the Sun", "theme": "Renewable energy", "passage": "For a class experiment, Boitumelo built a simple solar oven from a clean pizza box. She lined the inside with dark paper and covered an opening with clear plastic. Her teacher helped her position a shiny foil flap to reflect sunlight into the box. Boitumelo placed a small piece of chocolate inside and set the oven in a sunny spot. After twenty minutes, the chocolate had begun to soften. She tried the same experiment in the shade, but the chocolate changed very little. Boitumelo wrote down both results. During the class discussion, she explained that the oven worked best when sunlight entered and warm air was trapped inside. Her teacher reminded everyone that experiments involving heat should still be handled carefully.", "fact": ["What food did Boitumelo place in the solar oven?", ["Cheese", "Chocolate", "Bread", "Popcorn"], 1, "Look near the middle of the passage."], "detail": ["Name TWO materials she used in the solar oven.", [["box", "pizza"], ["dark paper", "plastic", "foil"]], "She used a pizza box and dark paper (or clear plastic or foil).", "Find the description of the box and its lining."], "infer": ["Why did the chocolate soften less in the shade?", [["less", "no", "shade", "sunlight"], ["heat", "warm", "temperature", "energy"]], "Less sunlight entered the box, so it did not become as warm.", "Compare how much sunlight reached the oven in each location."], "vocab": ["reflect", ["send light back in another direction", "hide something completely", "make a loud sound", "absorb water"], 0, "The shiny foil directed sunlight into the box."], "explain": ["Why did Boitumelo write down both results?", [["compare", "check", "difference", "record"], ["sun", "shade", "heat", "chocolate"]], "She wanted to compare how sunlight and shade affected the chocolate.", "Scientists need results from both conditions."], "grammar": ["boitumelo test the oven yesterday", "Boitumelo tested the oven yesterday.", "tested"], "summary": ["Write TWO sentences telling what she built and what she discovered.", [["solar", "oven", "box"], ["sun", "warm", "shade", "chocolate"]], "Boitumelo made a solar oven from a pizza box. She found that sunlight warmed the chocolate more than shade did.", "State the object and the finding."], "oral": "Explain why a solar oven works better in direct sunlight."}, {"title": "The Choir Practice", "theme": "Listening and cooperation", "passage": "The school choir was preparing for its first concert. At practice, the learners sang the opening verse loudly, but some rushed ahead of the music. Mrs Naidoo asked everyone to stop and listen to the piano before singing again. She tapped four steady beats and showed the singers when to begin. Musa, who usually sang very loudly, learned to lower his voice so he could hear the children beside him. After several attempts, the choir sang together with a clear rhythm. At the concert, their families applauded warmly. Musa realised that a choir does not succeed because one voice is the loudest. It succeeds when everyone listens carefully and works as a group.", "fact": ["Who showed the choir when to begin?", ["Musa", "Mrs Naidoo", "A visitor", "The principal"], 1, "The teacher gives the beat."], "detail": ["Name TWO changes the choir made during practice.", [["listen", "piano", "beat", "steady"], ["lower", "voice", "together", "not rush"]], "They listened to the piano beat and sang together without rushing.", "Find the teacher’s instruction and Musa’s adjustment."], "infer": ["Why did Musa lower his voice?", [["hear", "listen", "others", "children"], ["blend", "together", "choir", "not loud"]], "He needed to hear the others so his voice would blend with the group.", "Think about why a choir needs teamwork rather than shouting."], "vocab": ["rhythm", ["a regular pattern of beats", "the words of a song", "a type of instrument", "a stage curtain"], 0, "The children were learning to sing together in time."], "explain": ["Explain the difference between lyrics and rhythm.", [["lyrics", "words"], ["rhythm", "beat", "pattern", "time"]], "Lyrics are the words of a song, while rhythm is its pattern of beats.", "Remember the difference between words and beat."], "grammar": ["musa sing loudly yesterday", "Musa sang loudly yesterday.", "sang"], "summary": ["Write TWO sentences about the choir’s problem and improvement.", [["rush", "ahead", "loud", "beat"], ["listen", "together", "rhythm", "practice"]], "The choir rushed through the song and did not sing together. By listening to the piano and one another, they improved their rhythm.", "The first sentence is the problem; the next is the solution."], "oral": "Explain why listening is as important as singing in a choir."}, {"title": "The Tower That Needed Water", "theme": "Water supply", "passage": "In a small farming town, a tall water tank stood on a hill. It stored clean water that could flow down pipes to nearby homes. One summer, the town had very little rain, and the tank's water level dropped. The town council asked families to use water carefully. Laila's family repaired a dripping tap and collected water used to rinse vegetables for their garden. Her younger brother wanted to fill a paddling pool, but Laila explained that drinking, cooking and washing were more important during a shortage. After several weeks of careful use and some welcome rain, the water level slowly rose. The family learned that many small choices can protect a shared resource.", "fact": ["Where was the water tank situated?", ["Beside the beach", "On a hill", "Inside a school", "Under a bridge"], 1, "The first sentence gives the location."], "detail": ["Name TWO ways Laila’s family saved water.", [["fixed", "repaired", "tap", "drip"], ["reused", "rinse", "vegetable", "garden", "collected"]], "They repaired a dripping tap and reused vegetable-rinsing water in the garden.", "Find the two actions after the council’s request."], "infer": ["Why did Laila discourage filling the paddling pool?", [["shortage", "little rain", "low", "water"], ["important", "drink", "cooking", "washing", "save"]], "The town had limited water, so essential uses needed to come first.", "Consider which uses of water are necessary for health."], "vocab": ["resource", ["something useful that people depend on", "an empty container", "a dangerous storm", "a broken pipe"], 0, "The town shared something important."], "explain": ["Why can small household actions help the whole town?", [["save", "less", "water", "waste"], ["shared", "town", "tank", "everyone"]], "When many families use less water, more of the town’s shared supply remains.", "Think about what happens when every house repairs leaks."], "grammar": ["laila fix the tap yesterday", "Laila fixed the tap yesterday.", "fixed"], "summary": ["Write TWO sentences describing the shortage and the family’s response.", [["rain", "shortage", "tank", "low"], ["repaired", "tap", "reused", "saved"]], "A lack of rain reduced the town’s water supply. Laila’s family repaired a tap and reused water to save what they could.", "One sentence about the shortage and one about saving water."], "oral": "Explain two ways to save water at home."}, {"title": "A Bicycle for Themba", "theme": "Maintenance and persistence", "passage": "Themba hoped to ride his bicycle in the neighbourhood fun race, but the chain kept slipping off. At first, he tried pushing it back into place with his fingers. His older sister stopped him and reminded him to keep his hands away from moving parts. They turned the bicycle upside down and inspected the chain carefully. One link was stiff, and the chain needed cleaning and lubrication. With an adult's help, they repaired it and checked the brakes before the race. Themba practised on a quiet path until the bicycle ran smoothly. He did not win the race, but he finished safely and felt pleased that he had learned to take care of his equipment.", "fact": ["What problem did Themba’s bicycle have?", ["A flat tyre", "A slipping chain", "A broken seat", "A missing wheel"], 1, "The mechanical problem is in the first sentence."], "detail": ["Name TWO safety or maintenance checks they made.", [["clean", "lubricat", "chain", "link"], ["brake", "checked"]], "They cleaned the chain and checked the brakes.", "Look for the repair and the safety check before the race."], "infer": ["Why was finishing the race important even though Themba did not win?", [["finished", "persist", "try", "effort"], ["safe", "learn", "repair", "proud"]], "He persisted, finished safely and learned to look after his bicycle.", "Success can include learning and finishing, not just winning."], "vocab": ["inspected", ["looked at carefully", "threw away", "painted quickly", "moved silently"], 0, "They examined the chain to discover the problem."], "explain": ["Why should bicycle brakes be checked before a race?", [["stop", "slow", "brake"], ["safe", "accident", "danger", "control"]], "Working brakes help a rider stop safely and avoid an accident.", "Think about what happens if a bicycle cannot stop."], "grammar": ["themba ride his bicycle yesterday", "Themba rode his bicycle yesterday.", "rode"], "summary": ["Write TWO sentences explaining how Themba solved the problem.", [["chain", "slip", "broken", "stiff"], ["repaired", "clean", "brake", "finished"]], "Themba’s chain kept slipping off his bicycle. He repaired and checked it with help, then finished the race safely.", "Describe the fault and what happened after repair."], "oral": "Explain how to check that a bicycle is safe before riding."}, {"title": "The Puzzle Table", "theme": "Problem-solving and perseverance", "passage": "During the school puzzle competition, each team received a picture cut into sixty pieces. Olivia's team began by looking for matching colours, but they soon became confused. Olivia suggested finding the four corner pieces first and making the outside border. The other learners agreed, and the picture slowly took shape. One piece looked as if it belonged near the sun, but its edges did not fit. The team tried another place rather than forcing it. They completed the picture with only a minute left. The teacher congratulated them for changing their approach when their first idea failed. Olivia learned that a good plan can save time, but a plan must also be flexible when new information appears.", "fact": ["How many puzzle pieces did each team receive?", ["Twenty", "Forty", "Sixty", "One hundred"], 2, "The number is in the opening sentence."], "detail": ["Name TWO strategies the team used to solve the puzzle.", [["corner", "border", "outside"], ["matching", "colours", "edges", "fit"]], "They found the corner pieces and checked that the edges fitted.", "Look for the plan and how they checked the pieces."], "infer": ["Why did they avoid forcing a piece into place?", [["not fit", "edges", "wrong"], ["damage", "incorrect", "different", "try"]], "The edges did not match, so it probably belonged somewhere else.", "A puzzle piece should fit without being forced."], "vocab": ["flexible", ["willing to change a plan", "easy to break", "always in a hurry", "made of glass"], 0, "Olivia changed strategy when necessary."], "explain": ["What does the story suggest about solving difficult problems?", [["change", "plan", "try", "strategy"], ["think", "evidence", "fit", "not give up"]], "Good problem solvers try a strategy, check whether it works and change it when needed.", "The first strategy did not work well, but the team adjusted."], "grammar": ["olivia find the corners yesterday", "Olivia found the corners yesterday.", "found"], "summary": ["Write TWO sentences about the team’s difficulty and solution.", [["confused", "colour", "pieces", "difficult"], ["corner", "border", "plan", "finished"]], "The team became confused while sorting puzzle pieces. Olivia suggested making the border first, which helped them finish.", "State the challenge and the better strategy."], "oral": "Explain how you would start a large jigsaw puzzle."}, {"title": "The Weather Station Report", "theme": "Interpreting data", "passage": "Grade 4 recorded the afternoon temperature for five school days. On Monday it was 23 degrees Celsius, on Tuesday 26, on Wednesday 29, on Thursday 24 and on Friday 22. Jayden expected Friday to be the hottest day because the morning sunshine was bright. When the class compared their measurements, they discovered that Wednesday had been the hottest. Their teacher explained that bright sunlight early in the day does not alway ain how a temperature graph can help you check a prediction."}, {"title": "Seeds for Everyone", "theme": "Community gardens", "passage": "A neighbourhood group created a vegetable garden on an empty patch of land. On planting day, the adults showed children how to place seeds in straight rows with enough space between them. Priya planted spinach, while her friend Neo planted beans. The children wanted to water every hour, but the gardener explained that too much water could damage young plants. A schedule gave each family a turn to water and remove weeds. After four weeks, the spinach leaves were ready to harvest. Instead of keeping everything, the group shared some vegetables with an elderly neighbour who had helped donate tools. Priya realised that the garden provided more than food: it brought people together and taught them to take responsibility.", "fact": ["What vegetable did Priya plant?", ["Carrots", "Spinach", "Pumpkins", "Cabbages"], 1, "Look at the sentence describing Priya’s planting."], "detail": ["Name TWO responsibilities families had in the garden.", [["water", "schedule"], ["weeds", "remove", "pull"]], "Families took turns watering the vegetables and removing weeds.", "Look at the schedule made by the gardener."], "infer": ["Why did the gardener discourage watering every hour?", [["too much", "overwater"], ["damage", "harm", "roots", "plant"]], "Too much water could harm the young plants rather than help them grow.", "More of something is not always better."], "vocab": ["harvest", ["collect crops when ready", "dig a deep hole", "buy seeds from a shop", "water every hour"], 0, "The leaves had grown enough to collect."], "explain": ["Why did the group share vegetables with its elderly neighbour?", [["helped", "donated", "tools"], ["thank", "share", "kind", "gratitude"]], "They wanted to thank a neighbour who had contributed tools to the garden.", "Think about the neighbour’s earlier contribution."], "grammar": ["priya plant spinach yesterday", "Priya planted spinach yesterday.", "planted"], "summary": ["In TWO sentences, describe how the garden worked and what it achieved.", [["families", "water", "weeds", "schedule"], ["food", "share", "community", "vegetables"]], "Families shared watering and weeding duties in the garden. They grew vegetables and shared the harvest with their community.", "One sentence for teamwork and one for the outcome."], "oral": "Explain why sharing responsibilities makes a community garden successful."}, {"title": "A Creature in the Rock Pool", "theme": "Ocean habitats", "passage": "During a visit to a rocky shore, Sam noticed a small crab hiding beneath seaweed in a shallow pool. Its shell looked like the surrounding stones. Sam wanted to pick it up and show his cousin, but a marine guide asked him to observe it without touching. The guide explained that animals in rock pools must survive changing temperatures and waves. The crab's dull colour helped it blend into the rocks, making it harder for predators to spot. As the tide began to rise, Sam and his cousin moved away from the water's edge. They took a photograph and wrote down what they had seen. On the way home, Sam said that watching an animal in its own habitat was more interesting than disturbing it.", "fact": ["What animal did Sam find?", ["A jellyfish", "A crab", "A dolphin", "A sea turtle"], 1, "Look in the first sentence."], "detail": ["Name TWO things Sam and his cousin did to observe the animal responsibly.", [["not touch", "observe", "left", "did not pick"], ["photo", "photograph", "wrote", "notes", "moved away"]], "They left the crab undisturbed and took a photograph.", "The guide gives one instruction; later they record the sighting."], "infer": ["Why was the crab hard for predators to notice?", [["colour", "shell", "look like", "blend"], ["rocks", "stone", "camouflage", "hide"]], "Its dull shell blended with the rocks and helped it stay hidden.", "Compare the crab’s appearance with the stones."], "vocab": ["habitat", ["an animal’s natural home", "a kind of shell", "a dangerous wave", "a photograph"], 0, "Sam watched the animal where it naturally lived."], "explain": ["Why did the guide tell Sam not to pick up the crab?", [["protect", "not disturb", "safe", "animal"], ["habitat", "stress", "injure", "harm", "natural"]], "Handling the crab could disturb or harm it in its natural habitat.", "Think about how touching a small wild animal could affect it."], "grammar": ["sam see a crab yesterday", "Sam saw a crab yesterday.", "saw"], "summary": ["Write TWO sentences explaining the discovery and the safety lesson.", [["crab", "rock", "pool", "seaweed"], ["observe", "not touch", "tide", "safe"]], "Sam found a crab hiding in a rock pool. He observed it without touching it and moved back when the tide rose.", "Tell what he found and what he did carefully."], "oral": "Explain why we should leave wild animals in their natural habitats."}, {"title": "The Missing Recipe Page", "theme": "Sequencing and practical reasoning", "passage": "Grandma Ruth promised to teach Ethan how to make her favourite banana muffins. She placed flour, eggs, bananas and milk on the kitchen table. However, the recipe book was missing a page with the baking instructions. Ethan suggested guessing the oven temperature, but Grandma Ruth explained that an incorrect temperature could burn the muffins or leave them uncooked. They searched the book's index and found another recipe that used the same basic ingredients. Grandma Ruth compared the instructions and adjusted the amounts with care. Ethan mashed the bananas and mixed the ingredients while she handled the hot oven. When the muffins were ready, they let them cool before tasting them. Ethan learned that following instructions and asking an experienced adult were both important in the kitchen.", "fact": ["Which page was missing?", ["The cover", "The baking instructions page", "The shopping list", "The index"], 1, "Find the problem in the third sentence."], "detail": ["Name TWO safe decisions made while baking.", [["not guess", "check", "recipe", "compare", "instruction"], ["adult", "grandma", "oven", "cool"]], "They checked another recipe instead of guessing, and Grandma Ruth handled the hot oven.", "Look for the missing instruction and the adult’s role."], "infer": ["Why was guessing the temperature a bad idea?", [["burn", "uncooked", "wrong", "temperature"], ["safe", "fail", "muffin", "bake"]], "The muffins might burn or remain uncooked if the oven temperature was wrong.", "Read Grandma Ruth’s warning."], "vocab": ["adjusted", ["changed slightly to make suitable", "threw away", "measured without checking", "mixed too quickly"], 0, "Grandma Ruth changed some amounts carefully."], "explain": ["Why did they consult a different recipe?", [["missing", "instructions", "page"], ["similar", "ingredients", "compare", "guide"]], "They needed reliable baking instructions and used a similar recipe as a guide.", "They wanted an alternative to guessing."], "grammar": ["ethan mix the ingredients yesterday", "Ethan mixed the ingredients yesterday.", "mixed"], "summary": ["Write TWO sentences explaining how the missing page problem was solved.", [["recipe", "page", "missing", "instruction"], ["another", "compare", "adult", "bake"]], "The recipe was missing its baking instructions. Grandma Ruth found a similar recipe and helped Ethan bake safely.", "State the problem and the safe solution."], "oral": "Tell someone why cooking instructions and adult supervision matter."}, {"title": "Messages from Long Ago", "theme": "History and inference", "passage": "At a local museum, Zanele studied a letter written by a traveller more than a hundred years ago. The handwriting was difficult to read, and several words were unfamiliar. Her teacher helped the class work out that the traveller had taken three days to reach the next town by horse-drawn wagon. Zanele compared this with the journey her family now made by car in less than an hour. The class also noticed that the traveller wrote about carrying extra water and food because there were few shops along the route. Zanele copied one sentence into her notebook and wrote what she thought it meant in today's English. She understood that old letters can tell us about everyday life, but interpreting them requires attention to the time in which they were written.", "fact": ["How did the traveller journey to the next town?", ["By aeroplane", "By horse-drawn wagon", "By train", "By bicycle"], 1, "Look for the method of travel in the middle of the passage."], "detail": ["Name TWO differences between the old journey and a modern car journey.", [["three days", "days", "long", "slow"], ["less than hour", "car", "fast", "short"]], "The wagon trip took three days, while the car journey now takes less than an hour.", "Compare the two journey times."], "infer": ["Why did the traveller carry extra food and water?", [["few", "no", "shops", "route"], ["supplies", "eat", "drink", "journey"]], "There were few shops on the route, so travellers needed their own supplies.", "Look at the explanation after the journey comparison."], "vocab": ["interpreting", ["working out meaning", "counting pages", "putting in a box", "reading very loudly"], 0, "Zanele tried to understand old words."], "explain": ["Why should we consider when an old letter was written?", [["past", "time", "then", "historical"], ["different", "life", "transport", "words", "context"]], "Life, transport and language were different then, so the time helps explain the letter.", "The traveller lived very differently from us."], "grammar": ["zanele read an old letter yesterday", "Zanele read an old letter yesterday.", "read"], "summary": ["Write TWO sentences about what Zanele learned from the letter.", [["wagon", "three days", "journey"], ["past", "different", "car", "shop", "time"]], "The old letter described a three-day wagon journey. Zanele learned how different travel and daily life were in the past.", "Give one historical detail and its meaning."], "oral": "Explain one way travelling long ago was different from travelling today."}, {"title": "The Helpful Robot", "theme": "Technology and limitations", "passage": "At a technology exhibition, Omar watched a small robot deliver books from one table to another. The robot followed a dark line on the floor using a sensor underneath its body. When a visitor moved a chair across the line, the robot stopped instead of crashing. Omar thought the robot must understand everything happening in the room. The engineer explained that the robot had been programmed to follow certain instructions and respond to signals from its sensor. It could not decide to make tea or help a lost child without additional equipment and programming. Omar then asked to try the control panel and guided the robot along a new route. He learned that machines can be very useful while still having important limitations.", "fact": ["What was the robot delivering?", ["Fruit", "Books", "Water", "Shoes"], 1, "The robot’s task is described in the opening sentence."], "detail": ["Name TWO things the robot was designed to do.", [["follow", "line", "path", "sensor"], ["stop", "chair", "obstacle", "not crash"]], "It followed a marked line and stopped when an obstacle blocked it.", "Look for the line and the chair."], "infer": ["Why did the robot stop when the chair crossed the line?", [["sensor", "signal", "detect"], ["chair", "obstacle", "blocked", "stop"]], "Its sensor detected that the route was blocked and triggered a stop.", "The explanation mentions a sensor beneath the robot."], "vocab": ["limitations", ["things a machine cannot do", "extra batteries", "speed settings", "special colours"], 0, "The engineer described tasks outside the robot’s abilities."], "explain": ["Why was Omar wrong to think the robot understood everything?", [["program", "instruction", "sensor"], ["only", "certain", "cannot", "limited", "task"]], "It followed programmed instructions for specific tasks rather than understanding everything around it.", "Compare following a rule with understanding every situation."], "grammar": ["omar guide the robot yesterday", "Omar guided the robot yesterday.", "guided"], "summary": ["Write TWO sentences about how the robot worked and what Omar learned.", [["line", "sensor", "book", "robot"], ["program", "limit", "cannot", "instruction"]], "The robot used a sensor to follow a line while carrying books. Omar learned that its abilities depended on its programming.", "Describe its task and one limitation."], "oral": "Explain how a robot can help people and why it still needs instructions."}, {"title": "A Different Sports Day Plan", "theme": "Strategy and fair participation", "passage": "For Sports Day, the Grade 4 relay team planned to place its fastest runner first. A practice race showed that the team kept dropping the baton during changes. Coach Mokoena explained that smooth handovers could matter more than one runner's speed. The team then practised passing the baton while jogging and calling the next runner's name. They also changed the order so a confident starter began the race and a steady runner finished it. On Sports Day, another team ran faster but dropped its baton. Grade 4 completed every handover cleanly and finished second overall. Instead of being disappointed, the learners celebrated their improvement and congratulated the winners. They understood that good strategy, practice and sportsmanship contribute to success.", "fact": ["Where did the Grade 4 relay team finish?", ["First", "Second", "Third", "Fourth"], 1, "Look at the sentence about the final result."], "detail": ["Name TWO changes the team made after practising.", [["handover", "baton", "jog", "call"], ["order", "starter", "steady", "runner"]], "They practised baton handovers and changed the running order.", "Find two adjustments after the coach’s advice."], "infer": ["Why could a smooth baton handover matter more than speed?", [["drop", "baton", "lose", "time"], ["handover", "race", "team", "finish"]], "Dropping the baton wastes time, so good handovers can help a team finish well.", "Think about what the faster team did wrong."], "vocab": ["sportsmanship", ["fair and respectful behaviour in sport", "the speed of a runner", "the size of a team", "a piece of equipment"], 0, "The learners congratulated the winning team."], "explain": ["Why did the team celebrate even though they finished second?", [["improve", "better", "practice", "handovers"], ["second", "effort", "teamwork", "success"]], "They had improved their teamwork and finished with clean handovers, which was a success for them.", "Their goal was not only to win."], "grammar": ["the team practice yesterday", "The team practised yesterday.", "practised"], "summary": ["Write TWO sentences explaining the relay problem and improvement.", [["dropped", "baton", "handover"], ["practised", "second", "clean", "strategy"]], "The relay team initially dropped the baton during practice. They improved their handovers and finished second on Sports Day.", "Give the challenge, then the result."], "oral": "Explain why good teamwork can be more important than one very fast runner."}]</script>

function statusDictation(message,active){let status=document.getElementById('dictationStatus'),start=document.getElementById('dictateBtn'),stop=document.getElementById('stopDictationBtn');if(status)status.textContent=message;if(start)start.disabled=!!active||!speechAvailable;if(stop)stop.disabled=!active}
function cancelDictation(){let rec=recognizer;recognizer=null;dictationContext=null;if(rec)try{rec.abort()}catch(e){} }

function startDictation(qi){
 const Constructor=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Constructor)return alert('This browser does not support speech-to-text. Use current Chrome or Edge on HTTPS, or type.');
 if(recognizer)return;
 const CONSENT_KEY=VERSION+'-speechConsent';
 if(!readStore(CONSENT_KEY,false)){
  if(!confirm('Speech-to-text may send Jordan’s speech to the browser provider for recognition. This website saves the resulting text only; it does not record or store audio. Do you agree to use speech recognition?'))return;
  saveStore(CONSENT_KEY,true);
 }
 let textarea=document.getElementById('answerArea');if(!textarea)return;
 let ctx={day:dayIndex,qi,base:textarea.value.trim(),finalParts:[],lastText:textarea.value.trim()};
 try{
   let rec=new Constructor();rec.lang='en-ZA';rec.interimResults=true;rec.continuous=true;
   dictationContext=ctx;recognizer=rec;
   rec.onresult=event=>{
     if(recognizer!==rec||dictationContext!==ctx||dayIndex!==ctx.day||questionIndex!==ctx.qi)return;
     let finals=[],partials=[];
     for(let k=0;k<event.results.length;k++){
       let item=event.results[k],t=(item[0]?.transcript||'').trim();
       if(!t)continue;(item.isFinal?finals:partials).push(t);
     }
     ctx.finalParts=finals;
     let value=[ctx.base, ...finals, ...partials].filter(Boolean).join(' ').trim();
     textarea.value=value;
     let key=answerKey(qi);getAttempt().answers[key]=value;save();
     ctx.lastText=value;
     statusDictation(partials.length?'Listening… '+partials.join(' '):'Answer saved as text ✓ Keep speaking or press Stop.',true);
     const notice=document.getElementById('autosaveNotice');if(notice)notice.textContent='Voice converted to text and saved automatically ✓';
   };
   rec.onerror=event=>{
     if(recognizer!==rec)return;
     let explanations={not_allowed:'Microphone permission denied. Allow permission in your browser settings.', 'no-speech':'No words were heard. Try speaking more clearly.',network:'Speech recognition needs a working network connection.','audio-capture':'Microphone not available.'};
     statusDictation(explanations[event.error]||('Could not convert speech ('+event.error+'). Try again or type.'),false);
   };
   rec.onend=()=>{
     if(recognizer!==rec)return;
     recognizer=null;dictationContext=null;
     statusDictation('Stopped. Read your answer below and correct any mistakes. Press Start speaking to add more.',false);
   };
   statusDictation('Listening… Speak clearly.',true);

function normalize(s){return String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
